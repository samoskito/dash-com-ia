# ---------------------------------------------------------------------------
# secret_fail_patterns — export MUST fail (non-zero exit, no output written)
# if any pattern matches anywhere in the sanitized output tree.
# Mix of (a) identifier names that must not appear at all because the whole
# concept is stripped, and (b) real secret-value shapes.
# ---------------------------------------------------------------------------
secret_fail_patterns:
  # (a) identifiers whose mere presence signals leftover PalmUP-only code
  - 'UAZAPI_ADMIN_TOKEN'
  - 'LICENSE_SIGNING_PRIVATE_KEY'
  - 'LICENSE_SIGNING_PUBLIC_KEY'
  - 'LICENSE_DELIVERY_SECRET'
  - 'LICENSE_NOTIFY_UAZAPI_TOKEN'
  - 'GURU_WEBHOOK_SECRET'
  - 'ASAAS_API_KEY'
  - 'ASAAS_WEBHOOK_AUTH_TOKEN'
  - 'ASAAS_WEBHOOK_TOKEN'
  # (b) key/secret material shapes
  - '-----BEGIN PRIVATE KEY-----'
  - '-----BEGIN OPENSSH PRIVATE KEY-----'
  - '-----BEGIN RSA PRIVATE KEY-----'
  - '-----BEGIN EC PRIVATE KEY-----'
  - '\$aact_[A-Za-z0-9_=+/]{20,}'      # Asaas API key shape (sandbox+prod share the $aact_ prefix)
  - 'sk_live_[A-Za-z0-9]{16,}'
  - 'AKIA[0-9A-Z]{16}'
  - 'xox[baprs]-[A-Za-z0-9-]{10,}'     # belt-and-suspenders: Slack-style tokens if any ops script leaks in
  # (c) values assigned to the vars above must not be non-empty in exported
  # .env.example (values MUST stay blank in template):
  - '(?i)^(UAZAPI_ADMIN_TOKEN|LICENSE_[A-Z_]+|GURU_WEBHOOK_SECRET|ASAAS_[A-Z_]+)\s*=\s*\S+'

