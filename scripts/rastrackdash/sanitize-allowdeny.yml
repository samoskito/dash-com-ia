    evidence:
      - packages/shared/src/navigation.ts
      - apps/web/src/components/app-shell.tsx
      - apps/web/src/middleware.ts
      - apps/web/src/components/workspace-access-gate.tsx
      - apps/web/src/lib/current-workspace.ts
      - apps/web/src/app/(app)/integrations/page.tsx
  - id: ops-alerts-whatsapp-connections-stub
    description: >
      F3.3: OpsAlertService.runScan()'s disconnect-check branch calls
