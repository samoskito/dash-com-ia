# ---------------------------------------------------------------------------
# prisma_models_remove — models tied only to PalmUP billing/licensing/XMAX.
# Split into `remove` (confident) and the defer_review list above for
# ambiguous seat-related models. See INVENTORY.md for full model count.
# ---------------------------------------------------------------------------
prisma_models_remove:
  remove:
    - License
    - LicenseDeliveryArtifact
    - LicenseActivation
    - LicenseWebhookEvent
    - SubscriptionPlan
    - WorkspaceSubscription
    - WorkspaceBillingProfile
    - BillingProviderEvent
    - BillingContractAudit
    - PlatformFiscalSettings
    - BillingInvoice
    - PaymentCharge
    - SplitReceiver
    - SplitRule
    - XmaxIngress
    - XmaxAccount
    - XmaxContactEventDedup
    - XmaxShadowEvent
    - MetaOAuthState   # only used by the OAuth broker flow being removed
    - WhatsappSeat                # F3.2 MVP default: billing/ strip resolved the seat ambiguity to STRIP
    - WhatsappInstanceActivation  # same seat-concept resolution as WhatsappSeat
  notes: >
    F3.1 deferred WhatsappSeat/WhatsappInstanceActivation pending a product
    decision on the BYO seat-tracking concept. F3.2 MVP-default lock
    resolved this to STRIP (whole billing/ module, seat concept not cleanly
    isolable in this slice — see remove_paths.apps/api/src/billing/ note).
    Re-add as a standalone concept later if the student edition needs it.

# ---------------------------------------------------------------------------
# app_module_imports_remove — Nest modules dropped from app.module.ts.
# ---------------------------------------------------------------------------
app_module_imports_remove:
  remove:
    - LicensingModule
    - XmaxModule
    - BillingModule   # F3.2 MVP default: whole billing/ module stripped (see remove_paths note)

# ---------------------------------------------------------------------------
# module_registrations_strip — mechanical Nest import/registration cleanup
# in files OTHER than app.module.ts that reference a module/controller/
# service being deleted above. Each entry removes the matching
# `import { X } from "...";` line and any X occurrence inside a
# @Module({ imports/controllers/providers/exports: [...] }) array in that
# file. This does NOT rewrite deeper call-site logic (constructor injection
# of billing services still imported by their own relative path in a few
# service files) — those are left for the dangling-import scan to surface;
# see EXPORT_REPORT.md "Known limitations" after each run.
# ---------------------------------------------------------------------------
module_registrations_strip:
  - file: apps/api/src/webhooks/webhooks.module.ts
    identifiers: [BillingModule]
  - file: apps/api/src/inbound-webhooks/inbound-webhooks.module.ts
    identifiers:
      - BillingSeatModule
      - BackofficeInboundWebhookRecoveryController
      - BackofficeInboundWebhooksController
      - BackofficeInboundWebhookRecoveryService
      - BackofficeInboundWebhooksService
  - file: apps/api/src/inbound-webhook-production/inbound-webhook-production.module.ts
    identifiers: [BillingSeatModule]
  - file: apps/api/src/conversion-rules/conversion-rules.module.ts
    identifiers: [BillingSeatModule]
  - file: apps/api/src/inbound-webhook-replay/inbound-webhook-replay.module.ts
    identifiers: [InboundWebhookReplayController]
  - file: apps/api/src/workspaces/workspaces.module.ts
    identifiers:
      - BackofficeWorkspacesController
      - PlatformWorkspaceAccessService   # F3.3: only caller (BackofficeWorkspacesController) removed above
      - ClientSwapModule                 # F3.3: workspaces/client-swap/ dir already removed above
  - file: apps/api/src/auth/auth.module.ts
    identifiers: [PlatformAdminService, BackofficePlatformUsersController]
  - file: apps/api/src/diagnostics/diagnostics.module.ts
    identifiers: [DiagnosticsController]   # F3.3: controller deleted above (staff-only backoffice/diagnostics)
  - file: apps/api/src/external-data/external-data.module.ts
    identifiers: [BackofficeExternalDataController]   # F3.3: controller deleted above
  - file: apps/api/src/integrations/integrations.module.ts
    identifiers:
      - AsaasAdapter                    # F3.3: asaas/ integration dir removed, see integrations.service.ts residue codemod for the constructor/call-site cleanup
      - WhatsappConnectionsController   # F3.3: whatsapp-connections.* removed above (billing-only instance marketplace)
      - WhatsappConnectionsService

# ---------------------------------------------------------------------------
# barrel_exports_remove — `export * from "X";` lines dropped from shared
# package barrels once the schema file they point to is removed above.
# ---------------------------------------------------------------------------
barrel_exports_remove:
  - file: packages/shared/src/index.ts
    export_paths:
      - ./schemas/billing
      - ./schemas/platform-administration
