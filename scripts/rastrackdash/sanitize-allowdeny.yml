# ---------------------------------------------------------------------------
# defer_review — ambiguous modules that need a product decision before F3.2
# commits to strip or keep. Do not auto-delete these. The exporter fails
# loudly if a defer_review path is reachable from keep_paths without an
# explicit resolution (README gate #3).
#
# F3.2 note: every entry that was here in F3.1 has been resolved by Samuel's
# MVP-default lock (see remove_paths / app_module_imports_remove /
# prisma_models_remove above) EXCEPT meta/oauth/advanced below, which the
# MVP-default list did not cover. It stays deferred.
# ---------------------------------------------------------------------------
defer_review:
  - path: apps/api/src/integrations/integrations.controller.ts#meta/oauth/advanced
    reason: >
      Unclear if "advanced" Meta credential/routing endpoints are wired only
      to legacy_oauth connections (strip) or also usable from manual
      connections (keep). meta-connection-resolver.service.ts tags both
      "legacy_oauth" and "manual" sources; needs a read-through before F3.3.
      Not part of the F3.2 MVP-default lock (that only resolved the
      start/callback/state broker + UI button, see rewrite_rules
      .meta-oauth-broker-removal) — left untouched by the exporter.

# ---------------------------------------------------------------------------
# rewrite_rules — descriptive only in F3.1; F3.2 turns these into codemods.
# ---------------------------------------------------------------------------
rewrite_rules:
  - id: branding-package-name
    description: Rename package/app identifiers WppTrack -> RastrackDash (package.json "name" fields, EMAIL_FROM_NAME default, page <title>s).
    evidence:
      - package.json
      - .env.example (EMAIL_FROM_NAME=WppTrack)
  - id: branding-web-shell
    description: Web app shell copy/labels/tokens reference WppTrack; rebrand strings and design tokens.
    evidence:
      - apps/web/src/styles/
      - apps/web/src/components/app-shell.tsx
  - id: brevo-domain-assert
    description: >
      assertProductionBrevoConfig() hardcodes noreply@rastrack.app /
      suporte@rastrack.app and fails production boot otherwise. Rewrite to a
      generic "from/reply-to must be a verified sender for EMAIL_PROVIDER"
      check with no hardcoded domain, documented as BYO SMTP.
    evidence:
      - apps/api/src/config/deployment-config.ts:199-232
  - id: meta-oauth-broker-removal
    description: >
      Drop the OAuth-broker flow (GET /integrations/meta/start,
      GET /integrations/meta/callback, MetaOAuthState model, "legacy_oauth"
      source in meta-connection-resolver.service.ts) because it requires
      PalmUP's own META_APP_ID/SECRET. Keep only the "manual" connection
      path (POST /integrations/meta/manual/*) where the student supplies
      their own long-lived token.
      F3.2: applied as a real codemod (applyMetaOAuthBrokerRemoval in
      sanitize-export.mjs) — removes the two controller endpoint methods
      plus their now-dead private HTML-popup helpers, and removes the
      MetaOAuthButton import + JSX usage + its server-action file from the
      web integrations page. meta/oauth/advanced endpoints (separate
      ambiguity, see defer_review) are left untouched.
    evidence:
      - apps/api/src/integrations/integrations.controller.ts:75-99
      - apps/api/src/integrations/meta/meta-connection-resolver.service.ts
      - apps/web/src/app/(app)/integrations/meta-oauth-button.tsx
  - id: uazapi-byo-only
    description: >
      Strip every code path that reads UAZAPI_ADMIN_TOKEN (a PalmUP fleet
      admin credential used to provision instances on shared infra). Student
      edition talks to a single Uazapi instance the student owns, using only
      UAZAPI_BASE_URL + UAZAPI_TOKEN.
    evidence:
      - .env.example (UAZAPI_ADMIN_TOKEN=)
      - apps/api/src/billing/package-uazapi-provisioning.service.ts
  - id: cookie-and-url-domains
    description: Replace hardcoded rastrack.app defaults (AUTH_COOKIE_DOMAIN, API_PUBLIC_URL, META_OAUTH_REDIRECT_URL) with neutral placeholder / documented "set your own domain" env guidance.
    evidence:
      - .env.example
  - id: license-terminology-removal
    description: Remove all references to license keys/activation/Guru in docs, error messages, and onboarding copy once licensing/ is stripped.
    evidence:
      - apps/api/src/licensing/**

# ---------------------------------------------------------------------------
# secret_fail_patterns — export MUST fail (non-zero exit, no output written)
# if any pattern matches anywhere in the sanitized output tree.
# Mix of (a) identifier names that must not appear at all because the whole
# concept is stripped, and (b) real secret-value shapes.
# ---------------------------------------------------------------------------
secret_fail_patterns:
  # (a) identifiers whose mere presence signals leftover PalmUP-only code
  - 'UAZAPI_ADMIN_TOKEN'
  - 'LICENSE_SIGNING_PRIVATE_KEY'
  - 'LICENSE_SIGNING_PUBLIC_KEY'
  - 'LICENSE_DELIVERY_SECRET'
  - 'LICENSE_NOTIFY_UAZAPI_TOKEN'
  - 'GURU_WEBHOOK_SECRET'
  - 'ASAAS_API_KEY'
  - 'ASAAS_WEBHOOK_AUTH_TOKEN'
  - 'ASAAS_WEBHOOK_TOKEN'
  # (b) key/secret material shapes
  - '-----BEGIN PRIVATE KEY-----'
  - '-----BEGIN OPENSSH PRIVATE KEY-----'
  - '-----BEGIN RSA PRIVATE KEY-----'
  - '-----BEGIN EC PRIVATE KEY-----'
  - '\$aact_[A-Za-z0-9_=+/]{20,}'      # Asaas API key shape (sandbox+prod share the $aact_ prefix)
  - 'sk_live_[A-Za-z0-9]{16,}'
  - 'AKIA[0-9A-Z]{16}'
  - 'xox[baprs]-[A-Za-z0-9-]{10,}'     # belt-and-suspenders: Slack-style tokens if any ops script leaks in
  # (c) values assigned to the vars above must not be non-empty in exported
  # .env.example (values MUST stay blank in template):
  - '(?i)^(UAZAPI_ADMIN_TOKEN|LICENSE_[A-Z_]+|GURU_WEBHOOK_SECRET|ASAAS_[A-Z_]+)\s*=\s*\S+'

