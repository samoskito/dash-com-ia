# RastrackDash sanitize allow/deny inventory (F3.1)
#
# Consumed by the future export script (F3.2, scripts/rastrackdash/sanitize-export.mjs).
# This file is DATA ONLY — it does not implement the export. See README.md for gates.
#
# Evidence basis: apps/api/src (22 top-level modules), apps/web/src, packages/shared,
# apps/api/prisma/schema.prisma (79 models), .env.example, root configs.
# Walked at commit eebcfec (feat/rastrackdash-f3-sanitize branch base).

version: 1
generated_by: "F3.1 sanitize inventory (manual, evidence-based)"

