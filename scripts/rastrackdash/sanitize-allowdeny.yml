env_strip_notes:
  - "META_CONNECTION_MODES default is 'oauth' in the private template; rewrite default to 'manual' once the broker is removed (see rewrite_rules.meta-oauth-broker-removal)."
  - "META_OAUTH_REDIRECT_URL should be removed alongside the broker unless meta/oauth/advanced defer_review keeps some legacy_oauth path alive."

