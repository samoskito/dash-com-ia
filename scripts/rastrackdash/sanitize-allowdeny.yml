      - apps/api/src/billing/package-uazapi-provisioning.service.ts
  - id: cookie-and-url-domains
    description: Replace hardcoded rastrack.app defaults (AUTH_COOKIE_DOMAIN, API_PUBLIC_URL, META_OAUTH_REDIRECT_URL) with neutral placeholder / documented "set your own domain" env guidance.
    evidence:
