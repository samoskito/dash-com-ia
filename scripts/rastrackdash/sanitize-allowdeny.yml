      resolve the parameter type. Codemod (applyAsaasAdapterRemoval) drops
      the import, the constructor parameter, and the
      `this.asaasAdapter.getHealth()` call in getHealthSummary().
    evidence:
      - apps/api/src/integrations/integrations.service.ts
  - id: client-swap-web-panel-removal
    description: >
