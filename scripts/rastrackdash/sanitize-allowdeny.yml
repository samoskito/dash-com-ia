# ---------------------------------------------------------------------------
# module_registrations_strip — mechanical Nest import/registration cleanup
# in files OTHER than app.module.ts that reference a module/controller/
# service being deleted above. Each entry removes the matching
# `import { X } from "...";` line and any X occurrence inside a
# @Module({ imports/controllers/providers/exports: [...] }) array in that
# file. This does NOT rewrite deeper call-site logic (constructor injection
# of billing services still imported by their own relative path in a few
# service files) — those are left for the dangling-import scan to surface;
# see EXPORT_REPORT.md "Known limitations" after each run.
# ---------------------------------------------------------------------------
module_registrations_strip:
  - file: apps/api/src/webhooks/webhooks.module.ts
    identifiers: [BillingModule]
  - file: apps/api/src/inbound-webhooks/inbound-webhooks.module.ts
    identifiers:
      - BillingSeatModule
      - BackofficeInboundWebhookRecoveryController
      - BackofficeInboundWebhooksController
      - BackofficeInboundWebhookRecoveryService
      - BackofficeInboundWebhooksService
  - file: apps/api/src/inbound-webhook-production/inbound-webhook-production.module.ts
    identifiers: [BillingSeatModule]
  - file: apps/api/src/conversion-rules/conversion-rules.module.ts
    identifiers: [BillingSeatModule]
  - file: apps/api/src/inbound-webhook-replay/inbound-webhook-replay.module.ts
    identifiers: [InboundWebhookReplayController]
  - file: apps/api/src/workspaces/workspaces.module.ts
    identifiers: [BackofficeWorkspacesController]
  - file: apps/api/src/auth/auth.module.ts
