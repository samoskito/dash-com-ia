  - id: license-terminology-removal
    description: Remove all references to license keys/activation/Guru in docs, error messages, and onboarding copy once licensing/ is stripped.
    evidence:
      - apps/api/src/licensing/**
  - id: external-channel-seat-gate-noop
    description: >
      F3.3: three kept services (@Optional()-inject PackageBillingConfiguration
      + WhatsappSeatService from the removed billing/) already treat both as
      possibly-undefined at runtime — with billing/ stripped they always are,
      so externalChannelEnforcementEnabled() already always returned false in
      practice. Codemod (applySeatGateNoop) makes that the literal source
      instead of an inferred runtime outcome: drops the two billing/ type
      imports + optional constructor params, hardcodes
      externalChannelEnforcementEnabled() to `return false`, and stubs
      seatHook().activateSeat() to throw (unreachable, since it's only
      called when enforcement is enabled). No behavior change vs. the F3.2
      export, just resolves the dangling type import.
    evidence:
      - apps/api/src/conversion-rules/provider-conversion-rules.service.ts
      - apps/api/src/inbound-webhooks/inbound-webhook-channel-routes.service.ts
      - apps/api/src/inbound-webhooks/inbound-webhook-connections.service.ts
  - id: external-channel-billing-access-stub
    description: >
      F3.3: unlike the @Optional() services above, InboundWebhookProductionService
      and ProviderConversionProductionService @Inject() ExternalChannelBillingAccessService
      as a REQUIRED dependency provided by billing/billing-seat.module.ts — with
      BillingSeatModule already removed from their modules (F3.2), this is a
      real Nest DI break, not just a dangling type. Codemod
      (applyExternalChannelBillingAccessStub) replaces the import with a local
      always-allow stand-in (assertProductionAccess() no-ops, matching
      ExternalChannelBillingAccessService.isEnforced() === false once
      PackageBillingConfiguration is gone) and switches the constructor
      parameter to a plain instantiated field so there is no DI token left to
      resolve.
    evidence:
      - apps/api/src/inbound-webhook-production/inbound-webhook-production.service.ts
      - apps/api/src/inbound-webhook-production/provider-conversion-production.service.ts
  - id: platform-admin-user-local-type
    description: >
      F3.3: InboundWebhookReplayService imports the PlatformAdminUser TYPE
      only (never injects PlatformAdminService) to type an `actor` parameter
      on certifyParserRelease/authorizeReplay/retryTransientFailures — all
