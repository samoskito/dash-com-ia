      bootstrap (F3.3/F6 TODO) can re-wire a caller to.
    evidence:
      - apps/api/src/inbound-webhook-replay/inbound-webhook-replay.service.ts
  - id: asaas-adapter-removal
    description: >
      F3.3: integrations.service.ts constructs AsaasAdapter as a plain
      (non-@Inject) constructor parameter, so removing just the module
      registration (integrations.module.ts, handled generically) is not
